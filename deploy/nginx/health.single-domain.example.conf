# Single-domain reverse proxy for both services (used by deploy/install.sh).
#
# Replace `health.example.com` and point the certificate paths at your real
# files, e.g. after `certbot certonly --nginx -d health.example.com`.
#
#   /ingest, /health  -> ingest service (127.0.0.1:8001)
#   /mcp/<token>      -> MCP server     (127.0.0.1:8002), the Claude connector
#   /api/*            -> MCP server     (127.0.0.1:8002), the report routines

server {
    listen 80;
    server_name health.example.com;
    return 301 https://$host$request_uri;
}

server {
    # HTTP/1.1 on purpose: see the HTTP/2 caveat in the README.
    listen 443 ssl;
    server_name health.example.com;

    ssl_certificate     /etc/letsencrypt/live/health.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/health.example.com/privkey.pem;

    # Workout exports with heart-rate series can be large.
    client_max_body_size 200M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        proxy_pass http://127.0.0.1:8001;
    }

    location = /ingest {
        proxy_pass http://127.0.0.1:8001;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_read_timeout 120s;
    }

    location /mcp/ {
        # The URL path is the connector secret: keep it out of the access log.
        access_log off;
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        # Streamable-HTTP responses can be long-lived SSE streams.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
