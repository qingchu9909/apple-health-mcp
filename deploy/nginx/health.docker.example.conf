# Health butler (apple-health-mcp) site for an Nginx that runs in Docker with
# host networking, such as the kejilion.sh LDNMP stack (used by deploy/install.sh,
# which rewrites this file on every run).
#
# Container paths, bind-mounted from the host:
#   /etc/nginx/conf.d      this file, saved as <domain>.conf
#   /etc/nginx/certs       <domain>_cert.pem and <domain>_key.pem, from acme.sh
#   /var/www/letsencrypt   acme.sh webroot for the HTTP-01 challenge
#
# Routes are the same as in health.single-domain.example.conf. The installer
# first loads only the port-80 block, issues the certificate, then loads all.

server {
    listen 80;
    listen [::]:80;
    server_name health.example.com;

    location /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: loaded once the certificate exists ----

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name health.example.com;

    # HTTP/1.1 on purpose (see the HTTP/2 caveat in the README); the stack's
    # nginx.conf may switch HTTP/2 on for every site.
    http2 off;

    ssl_certificate     /etc/nginx/certs/health.example.com_cert.pem;
    ssl_certificate_key /etc/nginx/certs/health.example.com_key.pem;

    # Workout exports with heart-rate series can be large.
    client_max_body_size 200M;

    # Pass the services' own answers through, never from a shared cache.
    proxy_cache off;
    proxy_intercept_errors off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        proxy_pass http://127.0.0.1:8001;
    }

    location = /ingest {
        proxy_pass http://127.0.0.1:8001;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_read_timeout 120s;
    }

    location /mcp/ {
        # The URL path is the connector secret: keep it out of the access log.
        access_log off;
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;

        # Streamable-HTTP responses can be long-lived SSE streams.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        return 404;
    }
}
